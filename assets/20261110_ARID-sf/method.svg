<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#f5f8fa"/><style>text{font-family:sans-serif;fill:#173448}.title{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}</style><text x="35" y="45" class="title">候補構造から「実験構造への近さ」を予測</text><rect x="35" y="80" width="930" height="80" rx="12" fill="white" stroke="#b5c9d1"/><text x="55" y="110" class="title">01  候補PDBを整える</text><text x="55" y="141" class="body">抗原A → 抗体B ／ OPLS-UA ／ 同じ配列対の候補群</text><rect x="35" y="180" width="930" height="80" rx="12" fill="white" stroke="#b5c9d1"/><text x="55" y="210" class="title">02  界面を読む</text><text x="55" y="241" class="body">5 Å以内・最大75残基 × 4,253特徴</text><rect x="35" y="280" width="930" height="80" rx="12" fill="white" stroke="#b5c9d1"/><text x="55" y="310" class="title">03  局所情報と界面全体を統合</text><text x="55" y="341" class="body">物理ポテンシャル ＋ 接触 ＋ 形状 ＋ ESM-C</text><rect x="35" y="380" width="930" height="80" rx="12" fill="white" stroke="#b5c9d1"/><text x="55" y="410" class="title">04  品質を予測し、候補を並べ替える</text><text x="55" y="441" class="body">256次元 → self-attention → pooling → pDockQ</text><text x="35" y="505" class="body">出力は構造品質の推定値。結合確率やKdとしては解釈しない。</text><text x="35" y="540" class="small">v1 Figure 1・2 / SM15を参考にした独自の要約図（原図の転載ではない）</text></svg>