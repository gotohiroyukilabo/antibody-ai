<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img"><title>ESpma: 界面選択と点群統合の違い</title><style>text{font-family:system-ui,sans-serif;fill:#173344}.box{fill:#edf4f5;stroke:#91b5bc;stroke-width:2}.arrow{stroke:#345d6b;stroke-width:3;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><rect class="box" x="25" y="160" width="200" height="100" rx="12"/><text x="125.0" y="192" text-anchor="middle" font-size="18">二鎖の候補構造</text><text x="125.0" y="219" text-anchor="middle" font-size="18">配列 + 接触情報</text><rect class="box" x="275" y="160" width="220" height="100" rx="12"/><text x="385.0" y="192" text-anchor="middle" font-size="18">界面残基を選択</text><text x="385.0" y="219" text-anchor="middle" font-size="18">距離 + 埋没面積</text><rect class="box" x="550" y="35" width="260" height="110" rx="12"/><text x="680.0" y="67" text-anchor="middle" font-size="18">ESpma: pLM特徴</text><text x="680.0" y="94" text-anchor="middle" font-size="18">鎖ごとに平均 → 連結</text><text x="680.0" y="121" text-anchor="middle" font-size="18">ロジスティック回帰</text><rect class="box" x="550" y="290" width="260" height="110" rx="12"/><text x="680.0" y="322" text-anchor="middle" font-size="18">ESpma_pc: 表面点群</text><text x="680.0" y="349" text-anchor="middle" font-size="18">PointNet++ + pLM</text><text x="680.0" y="376" text-anchor="middle" font-size="18">cross-attentionで統合</text><rect class="box" x="865" y="160" width="190" height="100" rx="12"/><text x="960.0" y="192" text-anchor="middle" font-size="18">界面の分類</text><text x="960.0" y="219" text-anchor="middle" font-size="18">生物学的 / 結晶接触</text><path class="arrow" d="M225 210 H265"/><path class="arrow" d="M495 195 L540 90"/><path class="arrow" d="M495 225 L540 345"/><path class="arrow" d="M810 90 L855 185"/><path class="arrow" d="M810 345 L855 235"/><text x="540" y="430" text-anchor="middle" font-size="16">原論文Figure 1を参考にした独自の要約図（原図の転載ではない）</text></svg>