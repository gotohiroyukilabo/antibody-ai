<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img"><title>主testのAUROC比較。高いほどよい。</title><style>text{font-family:system-ui,sans-serif;fill:#24394d}</style><rect width="100%" height="100%" fill="white"/><text x="540" y="38" text-anchor="middle" font-size="24">主test 1,200ペア ・ AUROC（0–1、高いほどよい）</text><line x1="330" y1="65" x2="330" y2="535" stroke="#dbe2e8"/><text x="330" y="568" text-anchor="middle" font-size="18">0.0</text><line x1="460" y1="65" x2="460" y2="535" stroke="#dbe2e8"/><text x="460" y="568" text-anchor="middle" font-size="18">0.2</text><line x1="590" y1="65" x2="590" y2="535" stroke="#dbe2e8"/><text x="590" y="568" text-anchor="middle" font-size="18">0.4</text><line x1="720" y1="65" x2="720" y2="535" stroke="#dbe2e8"/><text x="720" y="568" text-anchor="middle" font-size="18">0.6</text><line x1="850" y1="65" x2="850" y2="535" stroke="#dbe2e8"/><text x="850" y="568" text-anchor="middle" font-size="18">0.8</text><line x1="980" y1="65" x2="980" y2="535" stroke="#dbe2e8"/><text x="980" y="568" text-anchor="middle" font-size="18">1.0</text><text x="22" y="113" font-size="20">SpatialPPIv2 / ProtT5</text><rect x="330" y="88" width="631.8" height="35" rx="4" fill="#69548c"/><text x="967.8" y="114" font-size="20">0.972</text><text x="22" y="186" font-size="20">FoldDock</text><rect x="330" y="161" width="617.5" height="35" rx="4" fill="#64899a"/><text x="953.5" y="187" font-size="20">0.950</text><text x="22" y="259" font-size="20">ESM-2 + 構造</text><rect x="330" y="234" width="625.9499999999999" height="35" rx="4" fill="#64899a"/><text x="961.9499999999999" y="260" font-size="20">0.963</text><text x="22" y="332" font-size="20">ESM-2+ac / FASTA</text><rect x="330" y="307" width="609.0500000000001" height="35" rx="4" fill="#64899a"/><text x="945.0500000000001" y="333" font-size="20">0.937</text><text x="22" y="405" font-size="20">ProtBert + 構造</text><rect x="330" y="380" width="595.4" height="35" rx="4" fill="#64899a"/><text x="931.4" y="406" font-size="20">0.916</text><text x="22" y="478" font-size="20">One-hot + 構造</text><rect x="330" y="453" width="565.5" height="35" rx="4" fill="#64899a"/><text x="901.5" y="479" font-size="20">0.870</text><text x="540" y="608" text-anchor="middle" font-size="18">Tables 3–4の選択値を再構成。信頼区間・有意差は主表に未提示。</text><text x="540" y="638" text-anchor="middle" font-size="17">独自の要約図（原ROC曲線の転載ではない）。FoldDock以外はSpatialPPIv2の構成比較。</text></svg>